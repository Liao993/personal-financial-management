# docker-compose.yml — BASE
# Run via: ./dev.sh up  or  ./prod.sh up

services:

  db:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./database/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/app
      - ./etl:/etl
      - ./service:/service
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SENTENCE_TRANSFORMER_MODEL: all-mpnet-base-v2
      GOOGLE_APPLICATION_CREDENTIALS: /service/google_creds.json
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID}
      GOOGLE_SHEET_NAME: ${GOOGLE_SHEET_NAME}
      ACCOUNT_NAMES: ${ACCOUNT_NAMES}
      FUND_CATEGORIES: ${FUND_CATEGORIES}
      TFSA_LIMIT: ${TFSA_LIMIT}
      RRSP_LIMIT: ${RRSP_LIMIT}

  dbt:
    build:
      context: .
      dockerfile: Dockerfile
    command: dbt run
    depends_on:
      db:
        condition: service_healthy
    environment:
      DBT_PROFILES_DIR: /dbt
      DBT_PROJECT_DIR: /dbt/budget_project
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DBT_TARGET: ${DBT_TARGET}
    volumes:
      - ./dbt:/dbt