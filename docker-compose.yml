services:
  db:
    image: postgres:14
    container_name: budget_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./database/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - budget_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: budget_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin # Persistent storage for pgAdmin
    depends_on:
      - db
    networks:
      - budget_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run app/main.py
    container_name: budget_streamlit
    ports:
      - "${STREAMLIT_PORT}:8501"
    depends_on:
      - db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      SENTENCE_TRANSFORMER_MODEL: all-mpnet-base-v2
    networks:
      - budget_network

  dbt:
    build:
      context: .
      dockerfile: Dockerfile
    command: dbt run
    container_name: budget_dbt
    depends_on:
      - db
    environment:
      DBT_PROFILES_DIR: /dbt
      DBT_PROJECT_DIR: /dbt/budget_project
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
    volumes:
      - ./dbt:/dbt
    networks:
      - budget_network

networks:
  budget_network:

volumes:
  postgres_data:
  pgadmin_data:
