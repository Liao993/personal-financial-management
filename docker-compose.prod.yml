# docker-compose.prod.yml — PRODUCTION overrides
# Run via: ./prod.sh up

services:

  db:
    container_name: budget_db
    restart: unless-stopped
    volumes:
      - ./database/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
      - ./database/03_expense_transaction_sync.sql:/docker-entrypoint-initdb.d/03_expense_transaction_sync.sql
      - ./database/04_portfolio_schema.sql:/docker-entrypoint-initdb.d/04_portfolio_schema.sql
      - ./database/05_expense_ingestion_dedupe.sql:/docker-entrypoint-initdb.d/05_expense_ingestion_dedupe.sql
      - ./database/06_income_deposit_account.sql:/docker-entrypoint-initdb.d/06_income_deposit_account.sql
      - ./database/07_transaction_category.sql:/docker-entrypoint-initdb.d/07_transaction_category.sql
      - ./database/08_retirement_account_limits.sql:/docker-entrypoint-initdb.d/08_retirement_account_limits.sql
      - ./database/09_traveling_category_update.sql:/docker-entrypoint-initdb.d/09_traveling_category_update.sql
      - ./database/10_reconcile_retirement_transfer.sql:/docker-entrypoint-initdb.d/10_reconcile_retirement_transfer.sql
      - ./database/11_fix_emergency_transfer_direction.sql:/docker-entrypoint-initdb.d/11_fix_emergency_transfer_direction.sql
      - ./database/12_backfill_income_transactions.sql:/docker-entrypoint-initdb.d/12_backfill_income_transactions.sql
      - ./database/13_remove_transaction_category_and_update_income_sources.sql:/docker-entrypoint-initdb.d/13_remove_transaction_category_and_update_income_sources.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - budget_network_prod

  app:
    container_name: budget_streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      APP_ENV: production
      ACCOUNT_NAMES: ${ACCOUNT_NAMES}
      FUND_CATEGORIES: ${FUND_CATEGORIES}
      BIWEEKLY_INCOME: ${BIWEEKLY_INCOME}
      MORTGAGE_TOTAL: ${MORTGAGE_TOTAL}
      MORTGAGE_LEFT: ${MORTGAGE_LEFT}
      PRINCIPAL_2024: ${PRINCIPAL_2024:-0}
      INTEREST_2024: ${INTEREST_2024:-0}
      PRINCIPAL_2025: ${PRINCIPAL_2025:-0}
      INTEREST_2025: ${INTEREST_2025:-0}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    networks:
      - budget_network_prod
  dbt:
    container_name: budget_dbt
    environment:
      APP_ENV: production
    networks:
      - budget_network_prod
  pgadmin:
    container_name: budget_pgadmin
    ports:
      - "127.0.0.1:5051:80"
    networks:
      - budget_network_prod
      
networks:
  budget_network_prod:
    name: budget_network_prod
volumes:
  postgres_data:
