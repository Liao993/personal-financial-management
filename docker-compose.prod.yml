# docker-compose.prod.yml — PRODUCTION overrides
# Run via: ./prod.sh up

services:

  db:
    container_name: budget_db
    restart: unless-stopped
    volumes:
      - ./database/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
      - ./database/03_expense_transaction_sync.sql:/docker-entrypoint-initdb.d/03_expense_transaction_sync.sql
      - ./database/04_portfolio_schema.sql:/docker-entrypoint-initdb.d/04_portfolio_schema.sql
      - ./database/05_expense_ingestion_dedupe.sql:/docker-entrypoint-initdb.d/05_expense_ingestion_dedupe.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - budget_network_prod

  app:
    container_name: budget_streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      APP_ENV: production
      ACCOUNT_NAMES: ${ACCOUNT_NAMES}
      FUND_CATEGORIES: ${FUND_CATEGORIES}
      TFSA_LIMIT: ${TFSA_LIMIT}
      RRSP_LIMIT: ${RRSP_LIMIT}
      BIWEEKLY_INCOME: ${BIWEEKLY_INCOME}
      MORTGAGE_TOTAL: ${MORTGAGE_TOTAL}
      MORTGAGE_LEFT: ${MORTGAGE_LEFT}
      PRINCIPAL_2024: ${PRINCIPAL_2024:-0}
      INTEREST_2024: ${INTEREST_2024:-0}
      PRINCIPAL_2025: ${PRINCIPAL_2025:-0}
      INTEREST_2025: ${INTEREST_2025:-0}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    networks:
      - budget_network_prod
  dbt:
    container_name: budget_dbt
    environment:
      APP_ENV: production
    networks:
      - budget_network_prod
      
networks:
  budget_network_prod:
    name: budget_network_prod
volumes:
  postgres_data:
